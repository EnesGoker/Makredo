name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  core:
    name: Ubuntu / Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          architecture: x64
      - name: Verify native SDK
        shell: pwsh
        run: |
          $info = dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'dotnet --info failed.' }
          $info
          if (($info -join "`n") -notmatch '(?m)^\s*Architecture:\s+x64\s*$') { throw 'Expected an x64 .NET host.' }
      - name: Build Release
        run: dotnet build -c Release -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Core tests
        run: dotnet test tests/Makredo.Core.Tests -c Release --no-build --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results
      - name: Verify test guard
        shell: pwsh
        run: ./scripts/verify-ci-tests.ps1 -SelfTest
      - name: Verify complete Core results
        if: always()
        shell: pwsh
        run: ./scripts/verify-ci-tests.ps1 -ResultsDirectory artifacts/test-results -Platform Linux
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-ubuntu-x64
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows / x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          architecture: x64
      - name: Verify native SDK
        shell: pwsh
        run: |
          $info = dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'dotnet --info failed.' }
          $info
          if (($info -join "`n") -notmatch '(?m)^\s*Architecture:\s+x64\s*$') { throw 'Expected an x64 .NET host.' }
      - name: Build Release
        run: dotnet build -c Release -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: All tests
        run: dotnet test -c Release --no-build --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results
      - name: Verify test guard
        shell: pwsh
        run: ./scripts/verify-ci-tests.ps1 -SelfTest
      - name: Verify complete Core and Windows results
        if: always()
        shell: pwsh
        run: ./scripts/verify-ci-tests.ps1 -ResultsDirectory artifacts/test-results -Platform Windows
      - name: Verify formatting
        run: dotnet format --verify-no-changes
      - name: Audit direct and transitive packages
        shell: pwsh
        run: |
          ./scripts/check-package-audit.ps1 -SelfTest
          dotnet list package --vulnerable --include-transitive --format json --output-version 1 --no-restore > artifacts/package-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Package audit command failed.' }
          ./scripts/check-package-audit.ps1 -ReportPath artifacts/package-audit.json -ExpectedProjects (([xml](Get-Content Makredo.slnx -Raw)).Solution.Project.Count)
      - name: Upload test results and package audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows-x64
          path: |
            artifacts/test-results/**/*.trx
            artifacts/package-audit.json
          if-no-files-found: error
          retention-days: 14

  windows-arm:
    name: Windows / ARM64
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          architecture: arm64
      - name: Verify native SDK
        shell: pwsh
        run: |
          $info = dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'dotnet --info failed.' }
          $info
          if (($info -join "`n") -notmatch '(?m)^\s*Architecture:\s+arm64\s*$') { throw 'Expected a native ARM64 .NET host.' }
      - name: Build Release
        run: dotnet build -c Release -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: All tests
        run: dotnet test -c Release --no-build --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results -- RunConfiguration.TargetPlatform=ARM64
      - name: Verify test guard
        shell: pwsh
        run: ./scripts/verify-ci-tests.ps1 -SelfTest
      - name: Verify complete Core and Windows results
        if: always()
        shell: pwsh
        run: ./scripts/verify-ci-tests.ps1 -ResultsDirectory artifacts/test-results -Platform Windows
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows-arm64
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 14
